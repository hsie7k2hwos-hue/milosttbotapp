<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Мряу</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!--
    URL API на BotHost. Можно задать здесь ИЛИ в config.js:
    <script>window.MRYAU_API_BASE = "https://ВАШ-БОТ-НА-BOTHOST";</script>
  -->
  <script src="./config.js"></script>
  <link rel="stylesheet" href="./static/app.css" />
</head>
<body>
  <div id="app">
    <header class="header" id="header">
      <div class="header-brand">
        <span class="logo">🃏</span>
        <span class="title">Мряу</span>
      </div>
      <div class="header-stats" id="header-stats">
        <div class="stat" title="Монеты">
          <span class="stat-icon">🪙</span>
          <span class="stat-val" id="hdr-coins">—</span>
        </div>
        <div class="stat" title="Стрик">
          <span class="stat-icon">🔥</span>
          <span class="stat-val" id="hdr-streak">—</span>
        </div>
      </div>
    </header>

    <main class="main" id="main">
      <section class="tab-panel active" id="panel-cards" data-tab="cards">
        <div class="section-head">
          <h2>Мои карточки</h2>
          <p class="muted" id="cards-summary">Загрузка…</p>
        </div>
        <div class="rarity-chips" id="rarity-chips"></div>
        <div class="cards-grid" id="cards-grid">
          <div class="loader">Загрузка…</div>
        </div>
      </section>

      <section class="tab-panel" id="panel-top" data-tab="top">
        <div class="section-head">
          <h2>Топ игроков</h2>
        </div>
        <div class="top-kinds" id="top-kinds">
          <button class="chip active" data-kind="coins">🪙 Монеты</button>
          <button class="chip" data-kind="cards">🃏 Карточки</button>
          <button class="chip" data-kind="streak">🔥 Стрик</button>
        </div>
        <div class="top-list" id="top-list">
          <div class="loader">Загрузка…</div>
        </div>
        <div class="my-rank" id="my-rank"></div>
      </section>

      <section class="tab-panel" id="panel-profile" data-tab="profile">
        <div id="profile-content">
          <div class="loader">Загрузка…</div>
        </div>
      </section>

      <section class="tab-panel" id="panel-other" data-tab="other" hidden>
        <div class="section-head row">
          <button class="btn-back" id="btn-back-other">‹ Назад</button>
          <h2 id="other-title">Профиль</h2>
        </div>
        <div id="other-content">
          <div class="loader">Загрузка…</div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" id="bottom-nav">
      <button class="nav-btn active" data-tab="cards">
        <span class="nav-icon">🃏</span>
        <span class="nav-label">Карточки</span>
      </button>
      <button class="nav-btn" data-tab="top">
        <span class="nav-icon">🏆</span>
        <span class="nav-label">Топ</span>
      </button>
      <button class="nav-btn" data-tab="profile">
        <span class="nav-icon">👤</span>
        <span class="nav-label">Профиль</span>
      </button>
    </nav>
  </div>

  <div class="modal" id="card-modal" hidden>
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-sheet">
      <div class="modal-photo-wrap">
        <img id="modal-photo" alt="" />
        <div class="modal-photo-placeholder" id="modal-placeholder">🃏</div>
      </div>
      <div class="modal-body">
        <h3 id="modal-name"></h3>
        <p id="modal-rarity" class="rarity-line"></p>
        <p id="modal-reward" class="muted"></p>
      </div>
      <button class="btn-primary" id="modal-close">Закрыть</button>
    </div>
  </div>

  <script src="./static/app.js"></script>
</body>
</html>
