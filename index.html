<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#12141c" />
  <title>Мряу</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header" id="header">
      <div class="header-stats">
        <div class="stat coins" id="hdr-coins">
          <span class="icon">🪙</span>
          <span class="val">—</span>
        </div>
        <div class="stat streak" id="hdr-streak">
          <span class="icon">🔥</span>
          <span class="val">—</span>
        </div>
      </div>
      <div class="header-user" id="hdr-name">…</div>
    </header>

    <!-- Content -->
    <main class="content" id="content">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Загрузка…</p>
      </div>
    </main>

    <!-- Bottom tabs -->
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="cards" type="button">
        <span class="tab-icon">🃏</span>
        <span class="tab-label">Карточки</span>
      </button>
      <button class="tab" data-tab="top" type="button">
        <span class="tab-icon">🏆</span>
        <span class="tab-label">Топ</span>
      </button>
      <button class="tab" data-tab="profile" type="button">
        <span class="tab-icon">👤</span>
        <span class="tab-label">Профиль</span>
      </button>
    </nav>
  </div>

  <!-- Card modal -->
  <div class="modal hidden" id="card-modal">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-sheet">
      <button class="modal-close" data-close type="button">✕</button>
      <div class="modal-body" id="card-modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
